<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Assunta app icon: an "A" whose crossbar is an audio waveform, on an indigo→violet squircle -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#shine)"/>
  <!-- A -->
  <path d="M322 774 L512 262 L702 774" fill="none" stroke="#FFFFFF" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- waveform crossbar -->
  <g fill="#FFFFFF">
    <rect x="442" y="640" width="32" height="60" rx="16"/>
    <rect x="496" y="600" width="32" height="140" rx="16"/>
    <rect x="550" y="640" width="32" height="60" rx="16"/>
  </g>
</svg>
